<style>
  :root{
    --paper:#FAF8F3;
    --paper-dim:#F0ECE2;
    --ink:#1C1B18;
    --ink-soft:#5B584F;
    --brass:#9C7A3C;
    --brass-soft:#C9AD74;
    --line:#DCD5C4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .headshot{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    outline:1px solid var(--line);
    box-shadow:0 10px 24px rgba(28,27,24,0.12);
    margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:16px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2rem, 6vw, 3.2rem);
    letter-spacing:-0.01em;
    margin-bottom:44px;
  }
  .langs{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .langs a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:150px;
    padding:26px 18px;
    border:1px solid var(--line);
    background:var(--paper-dim);
    color:var(--ink);
    text-decoration:none;
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .langs a:hover{
    background:var(--brass);
    border-color:var(--brass);
    transform:translateY(-2px);
  }
  .lang-code{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.6rem;
  }
  .lang-name{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .langs a:hover .lang-name{color:var(--ink);}
  footer{
    margin-top:52px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  @media(max-width:520px){
    .langs{flex-direction:column; align-items:center;}
    .langs a{width:220px;}
  }
</style>

<body>
  <img src="foto.jpg" alt="José Leite" class="headshot">
  <span class="eyebrow">CV — Currículo — Resume</span>

  <footer>Barcelona, España / Espanha / Spain</footer>
